# Local development services. NOT used in production (AWS uses Aurora Serverless v2).
#
#   docker compose up -d db     # start Postgres in the background
#   docker compose down         # stop it (data persists in the named volume)
#   docker compose down -v      # stop and wipe the database
#
# Credentials here are for LOCAL DEV ONLY — they match backend/.env defaults.

services:
  db:
    image: postgres:16
    container_name: favfifty-db
    environment:
      POSTGRES_USER: favfifty
      POSTGRES_PASSWORD: password
      POSTGRES_DB: favfifty
    ports:
      - "5432:5432"
    volumes:
      - favfifty_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U favfifty -d favfifty"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  favfifty_pgdata:
