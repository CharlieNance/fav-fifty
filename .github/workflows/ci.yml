name: CI

# Runs on every PR (this is what gates merges) and on pushes to main (so main
# is always known-good). Keep the checks here in sync with tools/check.sh.
on:
  push:
    branches: [main]
  pull_request:

# If you push again before a run finishes, cancel the stale one to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A throwaway Postgres for the tests + migration, matching docker-compose.yml
    # and backend/.env.example so local and CI behave the same.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: favfifty
          POSTGRES_PASSWORD: password
          POSTGRES_DB: favfifty
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U favfifty -d favfifty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://favfifty:password@localhost:5432/favfifty

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Tests (pytest)
        run: uv run pytest

  frontend:
    name: Frontend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Type-check + build (vue-tsc + vite)
        run: npm run build

      - name: Tests (vitest)
        run: npm run test

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    # Same throwaway Postgres as the backend job. e2e/global-setup.ts sees
    # CI=true and skips docker compose, then applies migrations against this.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: favfifty
          POSTGRES_PASSWORD: password
          POSTGRES_DB: favfifty
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U favfifty -d favfifty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://favfifty:password@localhost:5432/favfifty

    steps:
      - uses: actions/checkout@v7

      - name: Set up uv + Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts starts the frontend + backend itself, with
      # retries and an HTML report when CI=true.
      - name: Tests (playwright)
        run: npm run test:e2e

      # Report + traces for a failed run. Download the artifact and open it with
      # `npx playwright show-report`, or point the playwright-trace skill at a
      # trace.zip under test-results/.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
